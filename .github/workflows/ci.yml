name: Native QNX4 Common V2 development qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone https://github.com/Infiltrator-Projects/Libraries.git Libraries
          git -C Libraries checkout 225e640ebed5351b1481bfbeef1a6144ca5146e7
          make check
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  production-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build exact candidate SO
        run: |
          set -euo pipefail
          git clone https://github.com/Infiltrator-Projects/Libraries.git Libraries
          git -C Libraries checkout 225e640ebed5351b1481bfbeef1a6144ca5146e7
          make all
          sudo install -Dm644 build/QNX4.so /System/Filesystems/QNX4.so
          cmp build/QNX4.so /System/Filesystems/QNX4.so
      - name: Build the actual provider-neutral consumer
        run: |
          set -euo pipefail
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y --no-install-recommends build-essential cmake pkg-config libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
          git clone https://github.com/Infiltrator-Projects/Defragmenter.git consumer
          git -C consumer checkout 99e5922b3644f3f0efc87c69357d474237e417e7
          git -C consumer submodule update --init --recursive
          cmake -S consumer/defragger -B consumer/build -DBUILD_TESTING=ON -DLD_ENABLE_WERROR=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer/build --parallel 2
          sudo cmake --install consumer/build
      - name: Qualify the complete production corpus and both mutation policies
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          fixture=consumer/build/defragmenter-test-media-raw-test
          "$fixture" preflight qnx4
          "$fixture" preflight-corpus qnx4
          "$fixture" qualify-create qnx4 "$work/media.img"
          "$fixture" verify qnx4 "$work/media.img"
          "$fixture" verify-corruption qnx4 "$work/media.img"
          "$fixture" qualify-defrag qnx4 "$work/media.img"
          "$fixture" qualify-create qnx4 "$work/growth.img"
          "$fixture" qualify-growth qnx4 "$work/growth.img"
          "$fixture" preflight-mutations qnx4
          "$fixture" qualify-recovery qnx4
          echo 'QNX4 full production consumer qualification PASS'

  publish:
    needs: [native, production-consumer]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Infiltrator-Projects/Libraries
          ref: 225e640ebed5351b1481bfbeef1a6144ca5146e7
          path: Libraries
          persist-credentials: false
      - name: Build, test and publish the exact native provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Published version is immutable; increment VERSION for another release."
            exit 0
          fi
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          sh scripts/build-release.sh portable dist
          common=$(git -C Libraries rev-parse HEAD)
          curl -fsSL --retry 3 "https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$GITHUB_SHA" -o "$work/source.tar.gz"
          curl -fsSL --retry 3 "https://codeload.github.com/Infiltrator-Projects/Libraries/tar.gz/$common" -o "$work/common.tar.gz"
          source_hash=$(sha256sum "$work/source.tar.gz" | cut -d' ' -f1)
          common_hash=$(sha256sum "$work/common.tar.gz" | cut -d' ' -f1)
          run="dist/filesystem-qnx4-$version-native-installer.run"
          sed -e "s/@SOURCE@/$GITHUB_SHA/g" -e "s/@COMMON@/$common/g" -e "s/@SOURCE_HASH@/$source_hash/g" -e "s/@COMMON_HASH@/$common_hash/g" -e "s/@VERSION@/$version/g" scripts/installer.in > "$run"
          chmod +x "$run"
          "$run" --profile aggressive --system-package-mode --build-only --output "$work/native"
          deb="infiltrator-filesystem-qnx4_${version}_amd64.deb"
          pdf="System/Resources/Documentation/Filesystem-QNX4.pdf"
          so="System/Filesystems/QNX4.so"
          for package in "dist/$deb" "$work/native/$deb"; do
            test "$(dpkg-deb -f "$package" Package)" = 'infiltrator-filesystem-qnx4'
            test "$(dpkg-deb -f "$package" Version)" = "$version"
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            expected=$(printf './%s\n' "$pdf" "$so" | sort)
            actual=$(dpkg-deb --fsys-tarfile "$package" | tar -tf - | grep -v '/$' | sort)
            test "$actual" = "$expected"
            dpkg-deb -x "$package" "$work/extract"
            cmp "docs/QNX4.pdf" "$work/extract/$pdf"
            test "$(nm -D --defined-only "$work/extract/$so" | awk '{print $3}')" = infiltrator_filesystem_api_v2
          done
          test ! -e "/$pdf"
          test ! -e "/$so"
          sudo dpkg -i "$work/native/$deb"
          cmp "docs/QNX4.pdf" "/$pdf"
          cmp "$work/extract/$so" "/$so"
          sudo dpkg --purge infiltrator-filesystem-qnx4
          test ! -e "/$pdf"
          test ! -e "/$so"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          gh release create "v$version" --target "$GITHUB_SHA" --title "QNX4 v$version" --notes "Native Common V2 provider with journalled mutation limited to provider-formatted media and reference PDF; exact-revision development and native build tests passed. Physical boot and unadvertised operations are not qualified." "dist/$deb" "$run"
