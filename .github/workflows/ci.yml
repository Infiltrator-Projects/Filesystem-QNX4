name: Native QNX4 Common V2 development qualification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone https://github.com/Infiltrator-Projects/Libraries.git Libraries
          git -C Libraries checkout 225e640ebed5351b1481bfbeef1a6144ca5146e7
          make check
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" check

  production-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build exact candidate SO
        run: |
          set -euo pipefail
          git clone https://github.com/Infiltrator-Projects/Libraries.git Libraries
          git -C Libraries checkout 225e640ebed5351b1481bfbeef1a6144ca5146e7
          make all
          sudo install -Dm644 build/QNX4.so /System/Filesystems/QNX4.so
          cmp build/QNX4.so /System/Filesystems/QNX4.so
      - name: Build the actual provider-neutral consumer
        run: |
          set -euo pipefail
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          test -s /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y --no-install-recommends build-essential cmake pkg-config libgtk-3-dev libssl-dev libsqlite3-dev libext2fs-dev
          git clone https://github.com/Infiltrator-Projects/Defragmenter.git consumer
          git -C consumer checkout 99e5922b3644f3f0efc87c69357d474237e417e7
          git -C consumer submodule update --init --recursive
          cmake -S consumer/defragger -B consumer/build -DBUILD_TESTING=ON -DLD_ENABLE_WERROR=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer/build --parallel 2
          sudo cmake --install consumer/build
      - name: Qualify the complete production corpus and both mutation policies
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          fixture=consumer/build/defragmenter-test-media-raw-test
          "$fixture" preflight qnx4
          "$fixture" preflight-corpus qnx4
          "$fixture" qualify-create qnx4 "$work/media.img"
          "$fixture" verify qnx4 "$work/media.img"
          "$fixture" verify-corruption qnx4 "$work/media.img"
          "$fixture" qualify-defrag qnx4 "$work/media.img"
          "$fixture" qualify-create qnx4 "$work/growth.img"
          "$fixture" qualify-growth qnx4 "$work/growth.img"
          "$fixture" preflight-mutations qnx4
          "$fixture" qualify-recovery qnx4
          echo 'QNX4 full production consumer qualification PASS'
